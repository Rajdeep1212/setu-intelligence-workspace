<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Groq structured-output failure and correction</title>
  <desc id="desc">A historical forced-tools integration produced a tool-use failure. Commit 9384628 changed the Groq path to native strict JSON-schema output and added regression checks.</desc>
  <defs>
    <style>
      .bg{fill:#f7f3eb}.ink{fill:#092b3a}.muted{fill:#52646b}.orange{fill:#bd4b0b}.teal{fill:#087f7a}
      .panel{fill:#fff;stroke:#d8d3c8;stroke-width:2}.bad{fill:#fff4ef;stroke:#df8b60;stroke-width:2}.good{fill:#eef8f5;stroke:#78b7ae;stroke-width:2}
      .title{font:700 54px 'Segoe UI',Arial,sans-serif}.eyebrow{font:700 19px 'Segoe UI',Arial,sans-serif;letter-spacing:3px}
      .h{font:700 30px 'Segoe UI',Arial,sans-serif}.body{font:400 22px 'Segoe UI',Arial,sans-serif}.code{font:600 21px Consolas,'Courier New',monospace}.small{font:600 18px 'Segoe UI',Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1920" height="1080"/>
  <text x="90" y="90" class="eyebrow orange">HISTORICAL GIT EVIDENCE · COMMIT 9384628</text>
  <text x="90" y="158" class="title ink">From a forced tool route to native schema output</text>
  <text x="92" y="204" class="body muted">Sanitized engineering excerpt · no request content, credentials, or private endpoints</text>

  <rect x="90" y="280" width="740" height="458" rx="24" class="bad"/>
  <text x="130" y="334" class="eyebrow orange">BEFORE · PARENT COMMIT</text>
  <text x="130" y="389" class="h ink">Forced tool-calling pathway</text>
  <rect x="130" y="425" width="660" height="82" rx="14" fill="#092b3a"/>
  <text x="160" y="476" class="code" fill="#fff">instructor.Mode.TOOLS</text>
  <text x="130" y="563" class="body ink">Observed provider error category:</text>
  <text x="130" y="610" class="code orange">tool_use_failed</text>
  <text x="130" y="674" class="body muted">Diagnosis: request format forced an</text>
  <text x="130" y="707" class="body muted">inappropriate tool route for this call.</text>

  <text x="885" y="489" class="h orange">→</text>
  <text x="867" y="532" class="small muted">corrected</text>

  <rect x="1010" y="280" width="820" height="458" rx="24" class="good"/>
  <text x="1050" y="334" class="eyebrow teal">AFTER · COMMIT 9384628</text>
  <text x="1050" y="389" class="h ink">Native strict structured output</text>
  <rect x="1050" y="425" width="740" height="116" rx="14" fill="#092b3a"/>
  <text x="1080" y="472" class="code" fill="#fff">chat.completions.parse(</text>
  <text x="1120" y="510" class="code" fill="#9ee0d6">response_format=response_model</text>
  <text x="1080" y="534" class="code" fill="#fff">)</text>
  <text x="1050" y="600" class="body ink">Pydantic validation remains strict.</text>
  <text x="1050" y="644" class="body ink">Groq request contains no tools</text>
  <text x="1050" y="677" class="body ink">and no tool_choice.</text>
  <text x="1050" y="716" class="body muted">Grounding controls remain downstream.</text>

  <rect x="90" y="806" width="1740" height="168" rx="22" class="panel"/>
  <text x="130" y="858" class="eyebrow teal">REGRESSION PROTECTION</text>
  <text x="130" y="910" class="body ink">Request shape: no tools / no tool_choice</text>
  <text x="660" y="910" class="body ink">Schema: extra fields forbidden</text>
  <text x="1125" y="910" class="body ink">Diagnostics: sanitized categories only</text>
  <text x="130" y="951" class="small muted">Scope: fixes this integration path; it does not guarantee all provider reliability. Exact successful-attempt telemetry is unavailable.</text>
</svg>
