<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">SETU request architecture</title>
  <desc id="desc">A question passes through FastAPI, LangGraph, hybrid PostgreSQL and pgvector retrieval, reranking, structured generation, grounding validation, and a cited response.</desc>
  <defs>
    <style>
      .bg{fill:#f7f3eb}.ink{fill:#092b3a}.muted{fill:#52646b}.accent{fill:#bd4b0b}.teal{fill:#087f7a}
      .card{fill:#fff;stroke:#d8d3c8;stroke-width:2}.group{fill:#eef8f5;stroke:#78b7ae;stroke-width:2}
      .title{font:700 58px 'Segoe UI',Arial,sans-serif}.eyebrow{font:700 20px 'Segoe UI',Arial,sans-serif;letter-spacing:4px}
      .node{font:700 27px 'Segoe UI',Arial,sans-serif}.body{font:400 21px 'Segoe UI',Arial,sans-serif}.small{font:600 18px 'Segoe UI',Arial,sans-serif}
      .arrow{stroke:#bd4b0b;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bd4b0b"/></marker>
  </defs>
  <rect class="bg" width="1920" height="1080"/>
  <text x="92" y="94" class="eyebrow accent">SETU · REQUEST PATH</text>
  <text x="92" y="166" class="title ink">Official evidence before an answer</text>
  <text x="94" y="211" class="body muted">Implemented request flow · simplified for a 10–15 second recording frame</text>

  <rect x="90" y="315" width="225" height="176" rx="22" class="card"/>
  <text x="122" y="374" class="node ink">User question</text>
  <text x="122" y="418" class="body muted">English, Hindi</text>
  <text x="122" y="451" class="body muted">or Bengali</text>

  <path d="M315 403H372" class="arrow"/>
  <rect x="382" y="315" width="220" height="176" rx="22" class="card"/>
  <text x="415" y="374" class="node ink">FastAPI</text>
  <text x="415" y="418" class="body muted">Bounded request</text>
  <text x="415" y="451" class="body muted">and response</text>

  <path d="M602 403H659" class="arrow"/>
  <rect x="669" y="315" width="250" height="176" rx="22" class="card"/>
  <text x="702" y="374" class="node ink">LangGraph</text>
  <text x="702" y="418" class="body muted">Route and</text>
  <text x="702" y="451" class="body muted">orchestrate</text>

  <path d="M919 403H976" class="arrow"/>
  <rect x="986" y="278" width="490" height="250" rx="24" class="group"/>
  <text x="1020" y="330" class="eyebrow teal">HYBRID RETRIEVAL</text>
  <text x="1020" y="381" class="node ink">PostgreSQL + pgvector</text>
  <rect x="1020" y="412" width="128" height="70" rx="14" class="card"/>
  <text x="1084" y="454" text-anchor="middle" class="small ink">Dense</text>
  <text x="1170" y="454" class="node accent">+</text>
  <rect x="1194" y="412" width="142" height="70" rx="14" class="card"/>
  <text x="1265" y="454" text-anchor="middle" class="small ink">Keyword</text>
  <text x="1356" y="454" class="node accent">→</text>
  <text x="1395" y="441" text-anchor="middle" class="small ink">RRF</text>
  <text x="1395" y="469" text-anchor="middle" class="small ink">+ rerank</text>

  <path d="M1476 403H1533" class="arrow"/>
  <rect x="1543" y="315" width="285" height="176" rx="22" class="card"/>
  <text x="1575" y="365" class="node ink">LLM structured</text>
  <text x="1575" y="399" class="node ink">generation</text>
  <text x="1575" y="445" class="body muted">Strict schema</text>

  <path d="M1686 491V616H1243" class="arrow"/>
  <rect x="840" y="616" width="425" height="190" rx="22" class="card"/>
  <text x="875" y="672" class="eyebrow teal">GROUNDING VALIDATION</text>
  <text x="875" y="724" class="node ink">Citation membership</text>
  <text x="875" y="765" class="node ink">+ numerical checks</text>

  <path d="M1265 711H1342" class="arrow"/>
  <rect x="1352" y="616" width="476" height="190" rx="22" class="card"/>
  <text x="1387" y="672" class="eyebrow accent">GROUNDED RESPONSE</text>
  <text x="1387" y="724" class="node ink">Answer + citations</text>
  <text x="1387" y="765" class="body muted">Official source · apply · help</text>

  <rect x="90" y="892" width="1738" height="102" rx="18" fill="#092b3a"/>
  <text x="130" y="938" class="small" fill="#fff">Trust boundary</text>
  <text x="130" y="971" class="body" fill="#c8d7dc">Unsupported evidence, citation IDs, numbers, or response language can trigger correction or abstention.</text>
</svg>
