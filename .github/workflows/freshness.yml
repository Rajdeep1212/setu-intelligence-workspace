name: Source freshness watch

# Re-downloads every official source pinned in data/traffic_offences and in
# the scheme corpus manifests (corpus/manifests) and compares it with its pin.
# A failure means a source changed (a person must re-read it) or no source
# could be reached. Standard runner, two pinned HTML parsing packages for the
# text-watched scheme pages, no secrets, no artifacts: free for a public
# repository. GitHub emails the workflow owner when a scheduled run fails.

on:
  schedule:
    # Mondays 03:17 UTC (08:47 IST); off the hour to avoid queue peaks.
    - cron: "17 3 * * 1"
  push:
    branches: [master]
    paths:
      - "data/traffic_offences/**"
      - "corpus/manifests/**"
      - "ingestion/corpus_extract.py"
      - "ingestion/corpus_manifest.py"
      - "scripts/freshness_watch.py"
      - ".github/workflows/freshness.yml"

permissions:
  contents: read

concurrency:
  group: freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        # actions/setup-python v5.4.0
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Install HTML text extraction for text-watched pages
        run: python -m pip install --disable-pip-version-check --no-cache-dir beautifulsoup4==4.12.3 lxml==5.3.0

      - name: Compare official sources with pinned hashes
        run: python scripts/freshness_watch.py --summary "$GITHUB_STEP_SUMMARY"
