services:
  db:
    image: ${SETU_DB_IMAGE:-pgvector/pgvector:pg16}
    container_name: setu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-setu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setu}
      POSTGRES_DB: ${POSTGRES_DB:-setu}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - setu_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-setu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${SETU_API_IMAGE:-setu-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: setu-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-setu}:${POSTGRES_PASSWORD:-setu}@db:5432/${POSTGRES_DB:-setu}
      SETU_API_KEY: ${SETU_API_KEY:-}
      LOCAL_INFERENCE_BACKEND: ${LOCAL_INFERENCE_BACKEND:-pytorch}
      OPENVINO_MODEL_DIR: /models/openvino
      HF_HOME: /cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/ready', timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ./app:/app/app:ro
      - ./ingestion:/app/ingestion:ro
      - ./models/openvino:/models/openvino:ro
      - setu_hf_cache:/cache/huggingface

  openvino-export:
    profiles: ["openvino-export"]
    build:
      context: .
      dockerfile: Dockerfile.openvino-export
    environment:
      HF_HOME: /cache/huggingface
    volumes:
      - ./models/openvino:/output
      - setu_hf_cache:/cache/huggingface

volumes:
  setu_pgdata:
  setu_hf_cache:
